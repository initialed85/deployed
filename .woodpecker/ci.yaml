# fmt, vet and the tests that do not need infrastructure.
#
# `-skip` names four tests rather than excluding whole packages, so everything else in those packages
# still runs. The four are the ones that dial localhost:2221, which is the `ubuntu-ssh-server` container
# ./test.sh starts from Dockerfile.test before the suite. That image is not published, so there is
# nothing to put in `services:` yet.
#
# The list was measured, not guessed: with the fixture stopped (the real CI condition) the failures are
# TestSSH, TestDeployModes, TestRolloutModes and TestRolloutFolderMerge, and the rest of the suite is
# green. The earlier version of this file excluded only pkg/rollout on the strength of one reading of
# the failure, and it was wrong twice over - TestSSH and TestDeployModes were also infrastructure
# tests, and pkg/connection's TestLocal was not one, so the exclusion was hiding a real bug.
#
# The right fix is to publish the image (a step in this same pipeline builds it) and reference it under
# `services:`, which removes the skip list entirely. Left as a follow-up rather than done here, because
# it needs a registry decision that is not this lane's to make.
steps:
  - name: test
    image: docker.io/library/golang:1.26
    commands:
      - go version
      - gofmt -l .
      - test -z "$(gofmt -l .)"
      - go vet ./...
      - go test -count=1 -skip 'TestSSH|TestDeployModes|TestRolloutModes|TestRolloutFolderMerge' ./...

when:
  - event: push
    branch: master
  - event: pull_request
