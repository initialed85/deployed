# The live tier: four real VMs, a real k3s cluster, and TestDeploy/TestRollout against
# 192.168.56.11-14. This is the lane ci.yaml's header says is possible but does not exist.
#
# A separate file so the unit lane never pays for it: a privileged pod, a 7.9 GB image pull, and about
# four minutes of booting before a test has been compiled. It runs on master pushes and on a manual
# trigger (which is how you get a live run for something that is not master yet); a PR still gets the
# unit lane and the workflow lint, which is where a broken spec shows up cheaply.
#
# One step, not a stage. vagrant-libvirt builds its bridges inside the pod's network namespace and the
# live tests dial 192.168.56.x directly, so the tests have to run in the pod that owns libvirtd. A
# second step is a second pod: different netns, different libvirtd, connection refused. libvirt-init is
# backgrounded for the same reason - it never returns, it ends in a wait loop to keep virtlogd and
# libvirtd alive, so as a detached step it would be alive in a pod nobody can reach.
#
# `privileged` is the only special permission needed, and it needs the repo's security trust (the linter
# rejects a privileged step without it; deployed has it). A privileged pod sees every host device, so
# /dev/kvm is simply there as crw-rw---- root 991. A `devices:` list would be dropped anyway: the
# kubernetes backend never reads step.Devices (convert.go fills it, pod.go ignores it). No nodeSelector
# or affinity either - both are refused from step on our agent, and the agent already pins every step
# pod to ci-node=true, where all four CI nodes have /dev/kvm and nested=1.
#
# Resources are explicit because the namespace LimitRange otherwise gives a container 1 Gi, which
# OOM-kills four 1 GiB guests. 4 CPU / 8 Gi is the shape four guests measured: about 4 Gi used, on a
# 16 Gi node.
#
# No volume for /var/lib/libvirt/images, deliberately. `volumes:` needs the repo's volumes trust flag,
# which deployed does not have, and the only class this agent offers is woodpecker-workspace - NFS,
# where thin qcow2 with backing files is untested and 58 MB/s is not a disk to boot a lab from (1 GiB
# wrote in 18.0s there against 0.35s on local ext4). The pool stays on the pod's own filesystem, which
# is a real filesystem (overlay on the node's ext4, 179 GiB free), takes sparse files, qcow2 backing
# chains, flock and O_DIRECT, holds the 3.1 GiB base box plus four thin guests, and dies with the pod.
# That is the right lifetime for a CI lab: nothing to clean, nothing to leak between runs.
#
# The image ships no Go and go.mod wants 1.26.5, so the lane pins its own toolchain. Drop this line if
# the image ever grows one.
#
# The last two greps are the point of the file. A green run here means the live tier *ran*: TestDeploy
# and TestRollout skip themselves when nothing answers on 192.168.56.x, and a lane that quietly skipped
# would be a lane that proves nothing.
#
# k3s is served to the guests by tools/mirror on 192.168.56.1:8080, the gateway of the private net the pod
# itself builds. Four guests each pulling an 81 MB pinned release from GitHub has been refused three times
# out of three (306, 308, 310 - TestRollout reproducibly, TestDeploy after a warm-up); one flow here has not
# failed once, and the guests then need no third party at all.
steps:
  - name: live-lab
    image: docker.io/initialed85/ci-vagrant-libvirt:latest
    privileged: true
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "2"
            memory: "6Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
    commands:
      - libvirt-init < /dev/null > /tmp/libvirt-init.log 2>&1 &
      - "for i in $(seq 1 60); do grep -q 'LIBVIRT_READY: yes' /tmp/libvirt-init.log && break; sleep 1; done"
      - tail -n 20 /tmp/libvirt-init.log
      # 'yes' or 'no': libvirt-init derives that line from a virsh probe, so the bare token matches a broken
      # start as happily as a good one and the failure surfaces later as something unrelated.
      - "grep -q 'LIBVIRT_READY: yes' /tmp/libvirt-init.log || { echo 'libvirt-init did not become ready'; exit 1; }"
      - command -v go > /dev/null 2>&1 || { curl -fsSLo /tmp/go.tgz https://go.dev/dl/go1.26.5.linux-amd64.tar.gz && tar -C /usr/local -xzf /tmp/go.tgz; }
      - export PATH=/usr/local/go/bin:$PATH
      - go version
      # stdin is the pipe the step script itself arrived on, so anything that reads it gets a slice of
      # the rest of the script. vagrant shells out to ssh, which reads stdin.
      #
      # 1536 rather than the Vagrantfile's 1024, and this is the memory experiment rather than a settled
      # number: a 1024 guest reports 950 MiB total with 570-690 MiB of swap in use even on a run that goes
      # green, and every attempt-one failure here is sudo failing to authenticate on the master guest during a
      # real k3s install - four QEMU guests plus a k3s server importing images inside an 8 Gi limit. Four at
      # 1536 is 6 GiB of guest RAM, which is also what the pod now asks the scheduler for. The lab keeps 1024:
      # this variable is set here and nowhere else.
      - DEPLOYED_VM_MEMORY=1536 vagrant up --provider=libvirt < /dev/null
      # vagrant up returns when a guest answers SSH, not when it has finished booting. This gate has not yet
      # bought anything: with it in place, 320 passed TestDeploy on attempt one (54.51s, a real install) and
      # failed TestRollout instead, where before it was TestDeploy that failed and TestRollout that did not.
      # It stays because it is the only statement in this lane that measures boot work at all - is-system-running
      # answered degraded immediately in 316, 318 and 320 and gated nothing.
      - "for n in node1 node2 node3 node4; do vagrant ssh $n -c 'j=unknown; for i in $(seq 1 30); do j=$(systemctl list-jobs 2>/dev/null || true); [ \"$j\" = \"No jobs running.\" ] && break; sleep 2; done; echo BOOT_JOBS $j' < /dev/null; done"
      - virsh -c qemu:///system list --all
      # Every failure this lane has had, in every test it has hit, is sudo failing to authenticate inside a
      # guest session. So ask every guest for that capability before the tests do, and measure it on its own:
      # -k first so this is a fresh authentication and not a cached ticket, -K after so the probe leaves nothing
      # behind that the tests would then lean on. A SUDO_FAIL line here against a run that then fails is the
      # diagnosis; a SUDO_FAIL that still goes green says the flake is not authentication at all.
      - 'for n in node1 node2 node3 node4; do vagrant ssh $n -c "echo Password2 | sudo -S -k true >/dev/null 2>&1 && echo SUDO_OK $n || echo SUDO_FAIL $n; sudo -K" < /dev/null; done'
      # Started here rather than by env.sh, which this lane does not use: the mirror binds 192.168.56.1, an
      # address that only exists once vagrant has built the private net. Backgrounded in the same shell the
      # rest of the step runs in, so it is still serving when the tests dial in.
      - "go build -o /tmp/deployed-k3s-mirror ./tools/mirror && (/tmp/deployed-k3s-mirror > /tmp/deployed-k3s-mirror.log 2>&1 &) && for i in $(seq 1 60); do grep -q MIRROR_READY /tmp/deployed-k3s-mirror.log && break; sleep 1; done; tail -n 5 /tmp/deployed-k3s-mirror.log"
      # Ask every guest, serially, for the two paths its own installer will ask for. This is the reachability
      # that was flaky, now measured against something on the pod's own bridge instead of GitHub.
      - "for n in node1 node2 node3 node4; do vagrant ssh $n -c 'curl -fsS --max-time 15 -o /dev/null http://192.168.56.1:8080/get.k3s.io && curl -fsS --max-time 60 -o /dev/null http://192.168.56.1:8080/k3s-io/k3s/releases/download/v1.36.2%2Bk3s1/k3s && echo PREFLIGHT_OK || echo PREFLIGHT_FAIL' < /dev/null; done"
      # Pod-side, immediately before the tests: the pre-flight proved a guest can reach the mirror, this
      # proves it is still serving. A guest script that cannot probe it falls back to GitHub, so if the mirror
      # died between the two, the failure that follows looks like a GitHub failure - which is what 312 looked
      # like, and it cost a run to find out that no log said which of the two it was.
      - curl -fsS --max-time 10 -o /dev/null http://192.168.56.1:8080/get.k3s.io && echo MIRROR_ALIVE || echo MIRROR_DEAD
      # Not a pipe, and not go's exit code: a failing go test has to leave its log behind for the greps.
      # A stalled SSH session can park a test forever (x/crypto has no keepalive and Config.Timeout only
      # covers the handshake), so the tier gets a deadline: a hang has to fail the step, not eat it.
      - go test -count=1 -v -timeout 10m -run 'TestDeploy$|TestRollout$' ./... > /tmp/live-1.log 2>&1 || true
      # The spine of what the tier did, then everything the tests said. The filter is by timestamp, because
      # deployed's own chatter always starts with a date (Go's logger writes slashes, this lane has seen dashes
      # too) and test output never does: 8408 lines became 214 measured on a local run. The spine alone is not
      # enough - in 312 TestDeploy failed in 1.85s and the only detail the log held was the last 40 lines of
      # the *other* test, which said nothing about it.
      - "grep -E -- '^(=== RUN|--- (PASS|FAIL|SKIP)|ok |FAIL|panic)' /tmp/live-1.log || true"
      - "grep -vE '^[0-9]{4}[-/]' /tmp/live-1.log | head -n 200 || true"
      # The guest as the tests left it, taken before the cooldown so it is the state that actually failed. Both
      # red attempts one have died the same way: the installer reaches create_env_file, then stderr carries
      # 'chmod: cannot access /etc/systemd/system/k3s.service.env: No such file or directory' beside a
      # '[sudo: authenticate] Password:' - the touch that should have made the file made nothing, and the only
      # candidate left is that disk or memory ran out mid-install. Nothing in this lane has ever measured that.
      - "vagrant ssh node1 -c 'df -h /; free -h; ls -l /etc/systemd/system/k3s* 2>&1; systemctl is-active k3s' < /dev/null || true"
      # One retry, after a cooldown, because a red live lane is expensive to diagnose from one log: attempt
      # two runs against a lab that attempt one already half-installed, which is a different failure to look
      # at. It also exercises idempotency, which is the thing the tier is meant to prove - 306's second
      # attempt no-opped TestDeploy in 2.45s, 308's in 2.60s. Only specs that failed run again, because a
      # spec that failed never had its hash written. 310 failed TestRollout on both attempts, from a
      # 192.168.56.12 k3s install whose download GitHub refused; that is what the mirror above is for.
      - "grep -q -- '--- PASS: TestDeploy' /tmp/live-1.log && grep -q -- '--- PASS: TestRollout' /tmp/live-1.log || { sleep 30; go test -count=1 -v -timeout 10m -run 'TestDeploy$|TestRollout$' ./... > /tmp/live-2.log 2>&1 || true; }"
      - "[ -f /tmp/live-2.log ] && grep -E -- '^(=== RUN|--- (PASS|FAIL|SKIP)|ok |FAIL|panic)' /tmp/live-2.log || true"
      - "[ -f /tmp/live-2.log ] && grep -vE '^[0-9]{4}[-/]' /tmp/live-2.log | head -n 200 || true"
      # Which guest fetched what from the mirror, which is the difference between the mirror having served the
      # tier and the tier having quietly gone back to GitHub.
      - tail -n 30 /tmp/deployed-k3s-mirror.log
      # Quoted because each contains ": ", which YAML reads as a mapping, and a mapping in commands: is the
      # failure mode with no step logs at all. Over both attempts: green if either attempt passed the test, red
      # if neither did, which also catches the lane quietly skipping instead of running the tier. A glob, not
      # two filenames: the retry only writes its log when the retry runs, and 316 went red on grep's exit 2 for
      # a missing /tmp/live-2.log after an attempt one that had already passed both tests.
      - "grep -h -- '--- PASS: TestDeploy' /tmp/live-*.log"
      - "grep -h -- '--- PASS: TestRollout' /tmp/live-*.log"

when:
  - event: push
    branch: master
  - event: manual
