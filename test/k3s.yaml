#
# specs define the files to move around and scripts to execute
#

specs:
  - name: k3s-master
    with_sudo: true
    steps:
      # prefixing with "@" means "read in this file"
      - script: "@deploy-k3s-master.sh"
        downloads:
          # by naming a download, we can refer to it in any step of any spec, as long as it's already happened
          - name: k3s-master-kubeconfig
            remote: /home/user2/.kube
            local: /tmp/home-user2-dot-kube

  - name: k3s-agent
    with_sudo: true
    steps:
      - uploads:
          # prefixing with "?" means "refer to the download of this name"
          - local: "?k3s-master-kubeconfig"
            remote: /home/user2/.kube
        script: "@deploy-k3s-agent.sh"

  - name: k3s-kubeconfig
    steps:
      - uploads:
          - local: /tmp/home-user2-dot-kube/config
            remote: /home/${USER}/.kube/config-other

#
# pools define the targets
#

pools:
  - name: k3s-master-nodes
    targets:
      - user2:Password2@192.168.56.11:22

  - name: k3s-agent-nodes
    targets:
      - user2:Password2@192.168.56.12:22
      - user2:Password2@192.168.56.13:22
      - user2:Password2@192.168.56.14:22

  - name: local
    targets:
      - ${USER}:${PASS}@localhost:0

#
# mappings relate specs to pools (note: top-level sequence affects deployment order)
#

mappings:
  - spec:
      name: "@k3s-master"
    pools:
      - name: "@k3s-master-nodes"

  - spec:
      name: "@k3s-agent"
    pools:
      - name: "@k3s-agent-nodes"

  - spec:
      name: "@k3s-kubeconfig"
    pools:
      - name: "@local"
