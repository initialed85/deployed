name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.26.5'

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes jq upx

      - name: Build compressed binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          COMPRESS: '0'
        run: ./build.sh

      - name: Rename binary
        run: mv deployed deployed-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Package binary
        run: |
          tar -czf deployed-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz deployed-${{ matrix.goos }}-${{ matrix.goarch }}
          sha256sum deployed-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz > deployed-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployed-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            deployed-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            deployed-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: deployed-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
